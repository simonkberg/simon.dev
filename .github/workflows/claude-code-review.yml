name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the review can diff the branch against its base.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          allowed_bots: renovate[bot],claude[bot]
          # Built-in skill: correctness bugs plus reuse/simplification/efficiency
          # cleanups, following AGENTS.md via the CLAUDE.md symlink. "medium" keeps
          # to high-confidence findings; raise to "high" for broader, noisier coverage.
          prompt: "/code-review medium --comment ${{ github.event.pull_request.number }}"
          # Auto mode rather than an enumerated allowlist: the skill forks subagents
          # and reads the tree, so listing its tools by hand starves it (a narrow
          # list produced 15 permission denials and no review). --allowedTools is
          # still needed for the inline comment MCP server, which the action only
          # starts when that flag names it.
          claude_args: >-
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
