name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          allowed_bots: renovate[bot],claude[bot]
          # The skill reviews in subagents; without the second line the run can end
          # before they report, leaving the comment on its checklist.
          prompt: |
            /code-review medium --comment ${{ github.event.pull_request.number }}

            Run the review in the foreground and wait for every review and verification agent to finish. Do not end your turn until all findings are posted and the comment carries the final summary.
          # --allowedTools is what starts the inline comment MCP server.
          claude_args: >-
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
