name: Setup
description: Install Node from devEngines.runtime and the project's dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        # pnpm/setup saves a store per job, so only main's runs write it.
        save-cache: ${{ github.ref == 'refs/heads/main' }}
